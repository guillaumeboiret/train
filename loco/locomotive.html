<title>Anatomie d'une locomotive</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#11171d; --canvas:#1a2330; --horizon:#4a5b70; --ground:#353d47; --ballast:#474c52; --terrain:#8a9099;
  --panel:rgba(26,34,43,.92); --panel-solid:#1a222b; --panel-2:#222d38; --line:#31404e;
  --ink:#e7ecf1; --muted:#8e9ca9; --accent:#f28c28; --accent-ink:#1b1206;
  --fuel:#e5a934; --air:#cfe8ff; --exh:#9aa5b1; --ac:#3cc8ea; --dc:#5b9dff; --ac3:#c084ff;
  --hot:#ff5f45; --cold:#63d2ff; --heat:#ff7f3f; --cat:#ffd166; --ret:#7fe0a0;
  --ok:#43c977; --warn:#f2c53d; --bad:#ff5f45;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#e9ecef; --canvas:#dfe5ea; --horizon:#f1f4f6; --ground:#b9bfb3; --ballast:#a9a49a; --terrain:#ffffff;
    --panel:rgba(255,255,255,.93); --panel-solid:#ffffff; --panel-2:#f1f4f7; --line:#d3d9df;
    --ink:#172029; --muted:#5d6b78; --accent:#dd761b; --accent-ink:#1b1206;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e9ecef; --canvas:#dfe5ea; --horizon:#f1f4f6; --ground:#b9bfb3; --ballast:#a9a49a; --terrain:#ffffff;
  --panel:rgba(255,255,255,.93); --panel-solid:#ffffff; --panel-2:#f1f4f7; --line:#d3d9df;
  --ink:#172029; --muted:#5d6b78; --accent:#dd761b; --accent-ink:#1b1206;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--panel-solid);flex:0 0 auto;min-height:48px}
.brand{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand small{display:block;font:500 11px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel-2)}
.seg button{background:transparent;border:0;padding:6px 10px;cursor:pointer;color:var(--muted);font-weight:500;font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:focus-visible{outline-offset:-2px}
#btnStation,#cabNext,#kidStation{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}   /* Next stop, held down: the whole line */
#cabNext,#kidStation{touch-action:none}   /* a finger drifting a little must not turn into a pan that cancels the hold (nothing scrolls around them) */
#btnStation.holding,#cabNext.holding,#kidStation.holding{background-image:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45));background-repeat:no-repeat;background-size:0 100%;animation:holdFill .6s linear forwards}
@keyframes holdFill{to{background-size:100% 100%}}
.spacer{flex:1}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--canvas)}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c3d.dragging{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:500 11px/1 var(--font-body);letter-spacing:.04em;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:4px 7px;border-radius:3px;white-space:nowrap;will-change:transform}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--muted)}
.dock{position:absolute;left:12px;top:12px;bottom:12px;width:344px;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr) auto;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{background:transparent;border:0;padding:11px 4px 9px;cursor:pointer;color:var(--muted);font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline-offset:-3px}
#sheetToggle{padding:0 12px;font-size:18px;font-family:var(--font-body)}
.dock.collapsed{bottom:auto}
.dock.collapsed .panels{display:none}
.dock.collapsed #sheetToggle{transform:rotate(180deg)}
.panels{flex:1;min-height:0;overflow:auto;padding:14px 16px 18px;scrollbar-width:thin}
.tabpanel[hidden]{display:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.lab,.field>label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.val{font-family:var(--font-mono);color:var(--ink);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.notches{display:flex;justify-content:space-between;font:11px var(--font-mono);color:var(--muted);padding:0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.link{color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;font-weight:600;white-space:nowrap}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:pointer;font-weight:500;font-size:13px}
.switch+.switch{margin-top:8px}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .2s;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:left .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:19px;background:var(--accent-ink)}
.switch input:disabled{opacity:.4;cursor:not-allowed}
.status{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:14px}
.status div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto;transition:background .2s,box-shadow .2s}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.mode-note{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.parts h4{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.parts h4:first-child{margin-top:0}
.part{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--ink);font-size:13px}
.part:hover{background:var(--panel-2)}
.part[aria-pressed="true"]{border-color:var(--accent);background:var(--panel-2)}
.part .sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.part .eye{margin-left:auto;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:12px;line-height:1}
.part .eye[aria-pressed="true"]{color:var(--accent);text-decoration:line-through}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;padding:8px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:var(--ink);font-size:13px;line-height:1.3}
.step .n{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:1px}
.step:hover{background:var(--panel-2)}
.step[aria-current="step"]{border-color:var(--accent);background:var(--panel-2)}
.step.done .n{color:var(--ok)}
.infocard{flex:0 1 auto;min-height:0;max-height:45%;overflow:auto;scrollbar-width:thin;margin:10px 10px 0;padding:12px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.dock:is([data-tab="controls"],[data-tab="views"]) .infocard,.dock[data-tab="parts"] .infocard:not(.is-part),.dock.collapsed .infocard{display:none}   /* the guide's step or the picked part: with the guide and the parts only */
.infocard .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.infocard h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.infocard p{margin:6px 0 0;grid-column:1/-1;font-size:13px}
.infocard .legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.infocard .legend:empty{display:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.infocard .close{grid-column:2;grid-row:1/3;align-self:start;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1}
.gauges{position:absolute;top:12px;right:76px;display:grid;grid-auto-flow:column;gap:8px}   /* the compass keeps the corner */
.compass{position:absolute;top:19px;right:12px;width:56px;height:56px;box-sizing:border-box;border-radius:50%;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);pointer-events:none}
.compass svg{display:block;width:100%;height:100%}
.cp-tick{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round}
.cp-n{fill:#e5484d}.cp-s{fill:var(--muted)}.cp-hub{fill:var(--panel-solid)}.cp-mark{fill:var(--accent)}
.cp-l{font:700 12px/1 var(--font-display);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.cp-l.cp-ln{fill:#e5484d}
.g{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:8px 10px 9px;min-width:104px}
.g .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.g .v{font-family:var(--font-mono);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.g .u{font-size:11px;color:var(--muted);margin-left:2px;font-family:var(--font-body)}
.g .bar{height:3px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s linear}
.diesel-only,.electric-only,.tgv-only{display:contents}
body[data-mode="electric"] .diesel-only,body[data-mode="tgv"] .diesel-only{display:none}
body[data-mode="diesel"] .electric-only{display:none}
body:not([data-mode="tgv"]) .tgv-only{display:none}
.hint{font-size:12px;color:var(--muted);line-height:1.35}
.infocard .mini{display:none}
.infocard.collapsed{padding:7px 8px 7px 12px;cursor:pointer;align-items:center;gap:0 10px}
.infocard.collapsed h2,.infocard.collapsed p,.infocard.collapsed .legend{display:none}
.infocard.collapsed .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infocard.collapsed .mini{display:inline;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;margin-left:8px}
.infocard.collapsed .close{grid-row:1;width:24px;height:24px;font-size:12px}
.hud{position:absolute;left:368px;right:12px;bottom:12px;display:flex;align-items:center;gap:4px 18px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px}
.dock.collapsed~.hud{left:12px}
.hud-info{flex:0 1 auto;min-width:0;display:grid;gap:3px}
.hud #routeBar{flex:1 1 300px;min-width:0;margin-top:0}
.hud-row{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.hud .hk{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hud .hv{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);margin-right:4px;white-space:nowrap}
.hud .hv b{font-weight:500;font-size:14px}
.hud .hud-kind{color:var(--accent);font-weight:600;margin-left:auto}
#routeBar{position:relative;height:32px;margin-top:6px;cursor:pointer;touch-action:none}
#rbTip{position:absolute;top:-22px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font:600 10px/1 var(--font-mono);padding:3px 6px;border-radius:3px;pointer-events:none;white-space:nowrap;display:none}
.pk-row{align-items:center}
#pkIn{width:110px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-family:var(--font-mono);font-size:13px;color:var(--ink)}
#routeBar::before{content:"";position:absolute;left:7px;right:7px;top:7px;height:2px;background:var(--line)}
.rb-in{position:absolute;inset:0 7px}
.rb-st{position:absolute;top:0;width:16px;height:16px;transform:translateX(-50%);background:transparent;border:0;cursor:pointer;padding:0;display:grid;place-items:center}
.rb-st i{width:10px;height:10px;border-radius:50%;background:var(--panel-solid);border:2px solid var(--muted);display:block}
.rb-st:hover i,.rb-st:focus-visible i{border-color:var(--ink)}
.rb-lb{position:absolute;top:17px;transform:translateX(-50%);color:var(--muted);font-size:10px;line-height:1;white-space:nowrap;pointer-events:none}
.rb-lb.r{transform:translateX(-5px)}
.rb-lb.l{transform:translateX(calc(5px - 100%))}
#rbTrain{position:absolute;top:2px;width:12px;height:12px;border-radius:2px;background:var(--accent);transform:translateX(-50%);pointer-events:none;box-shadow:0 0 0 2px var(--panel-solid)}
.cab-bar{position:absolute;top:12px;right:12px;display:none;gap:8px}
.cab-bar button{width:44px;height:44px;padding:0;border-radius:50%;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
#cabUi[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
body.in-cab:not(.cab-ui) :is(.dock,.infocard,.gauges,.hud,.compass,#labels){display:none}
body.in-cab .cab-bar{display:flex}
body.in-cab .gauges{top:68px}body.in-cab .compass{top:75px}   /* the cab's two buttons keep the top right corner */
/* the cab's own controls while the page's are put away: the line bar over the windshield, the power/brake lever at the driver's left hand */
.cab-deck{display:none;position:absolute;inset:12px;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}   /* a column: the line on top, the lever in the room left under it, however tall the line grows */
body.in-cab:not(.cab-ui) .cab-deck{display:flex}
.cab-deck>*{pointer-events:auto}
.cab-line{align-self:center;width:min(680px,calc(100% - 216px));background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:10px 12px 2px}
.cab-line #routeBar{margin-top:0}
.cab-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:6px 0 8px}.cab-row .seg{display:flex}.cab-dir.moving button[aria-pressed="false"]{opacity:.4}   /* the way the train cannot take while it runs */
.cab-say{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;max-width:min(320px,calc(100% - 140px));background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:600;text-align:center;white-space:pre-line;pointer-events:none}
.cab-say.r{left:auto;right:24px;transform:translateY(-50%)}.cab-say.l{left:110px;transform:translateY(-50%)}   /* beside the edge tapped, clear of the lever */
body.in-cab .cab-say:not([hidden]){display:block}
.cab-lever{margin:auto 0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;-webkit-user-select:none;user-select:none}
.cl-end{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ok)}
.cl-end:last-child{color:var(--bad)}
.cl-track{position:relative;width:52px;height:min(240px,36vh);margin:9px 0;cursor:ns-resize;touch-action:none;border-radius:4px}
.cl-track:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.cl-track::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:8px;transform:translateX(-50%);border-radius:4px;background:linear-gradient(var(--ok),var(--panel-2) 50%,var(--bad))}
.cl-track i{position:absolute;left:12px;right:12px;height:1px;background:var(--muted)}
.cl-track i.z{left:4px;right:4px;height:2px;margin-top:-1px;background:var(--ink)}
#clKnob{position:absolute;left:0;right:0;top:50%;height:20px;transform:translateY(-50%);border-radius:5px;background:var(--panel-solid);border:2px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:top .12s}
#clVal{position:absolute;left:calc(100% + 18px);top:50%;transform:translateY(-50%);background:var(--accent);color:var(--accent-ink);font:600 11px/1 var(--font-mono);padding:4px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
/* walking through the train: the page's controls put away, ✕ top right; on a touch screen two sticks as in a game (left walks, right looks) with Sit over the right one; with the mouse taken (a click on the view) a crosshair */
.walk-bar{display:none}
body.walking .walk-bar{display:block}
body.walking :is(.dock,.infocard,.gauges,.hud,.compass,#labels){display:none}
.walk-bar button{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.walk-stick{--d:128px;display:none;position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:var(--d);height:var(--d);border-radius:50%;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.walk-stick.r{left:auto;right:16px}
.walk-stick b{position:absolute;left:50%;top:50%;width:calc(var(--d) * .45);height:calc(var(--d) * .45);transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--d) * .2);font-weight:400;background:var(--panel-solid);border:2px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.walk-stick.on b{border-color:var(--accent)}
body.touch .walk-stick{display:block}
.walk-sit{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:52px;padding:0 22px;border-radius:26px;font-weight:600;font-size:15px}
body.touch .walk-sit{bottom:calc(156px + env(safe-area-inset-bottom,0px))}   /* over the right stick */
.walk-leave{position:absolute;top:12px;right:12px;width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;line-height:1}
.walk-say{position:absolute;top:14px;left:50%;transform:translateX(-50%);max-width:min(560px,calc(100% - 140px));background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13.5px;text-align:center;pointer-events:none}
.walk-say[hidden]{display:none}
